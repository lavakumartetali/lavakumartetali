<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="35%" stop-color="#101b33"/>
      <stop offset="100%" stop-color="#0d766e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <style>
      .title { font: 700 46px 'Segoe UI', Inter, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 20px 'Segoe UI', Inter, Arial, sans-serif; fill: #dbeafe; }
      .code { font: 500 18px 'Consolas', 'SFMono-Regular', monospace; fill: #d4f8f1; }
      .muted { font: 500 14px 'Segoe UI', Inter, Arial, sans-serif; fill: #8fe8dc; }
    </style>
  </defs>

  <rect width="1280" height="320" rx="12" fill="url(#bg)"/>

  <!-- Background grid -->
  <g opacity="0.14" stroke="#c4f6ef" stroke-width="1">
    <path d="M0 60 H1280 M0 120 H1280 M0 180 H1280 M0 240 H1280"/>
    <path d="M160 0 V320 M320 0 V320 M480 0 V320 M640 0 V320 M800 0 V320 M960 0 V320 M1120 0 V320"/>
  </g>

  <!-- Glow shapes -->
  <circle cx="1100" cy="74" r="82" fill="url(#glow)" opacity="0.35" filter="url(#softGlow)"/>
  <circle cx="1030" cy="225" r="65" fill="#34d399" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="250" cy="225" r="52" fill="#60a5fa" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Node connections -->
  <g stroke="#baf8ef" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M300 140 C385 75, 515 78, 620 138"/>
    <path d="M620 138 C720 182, 820 190, 920 140"/>
    <path d="M480 230 C570 200, 690 212, 770 240"/>
    <path d="M770 240 C865 260, 960 255, 1045 218"/>
  </g>

  <g fill="#dffdf9" opacity="0.85">
    <circle cx="300" cy="140" r="5"/>
    <circle cx="620" cy="138" r="5"/>
    <circle cx="920" cy="140" r="5"/>
    <circle cx="480" cy="230" r="5"/>
    <circle cx="770" cy="240" r="5"/>
    <circle cx="1045" cy="218" r="5"/>
  </g>

  <!-- Code blocks -->
  <g transform="translate(60 40)">
    <rect x="0" y="0" width="290" height="78" rx="10" fill="#0b1220" opacity="0.42" stroke="#7dd3fc" stroke-opacity="0.3"/>
    <text x="20" y="28" class="code">const tests = playright.run()</text>
    <text x="20" y="52" class="code">const ai = copilot.assist()</text>
    <text x="20" y="76" class="code">const qa = automate();</text>
  </g>

  <!-- Main text -->
  <text x="80" y="142" class="title">Lava Kumar</text>
  <text x="80" y="188" class="subtitle">Test Engineer • Automation Developer • AI-assisted Engineer</text>
  <text x="80" y="226" class="subtitle">Playwright • Auto+ • RAG • LLMs • Quality Engineering</text>

  <!-- Footer -->
  <text x="80" y="268" class="muted">Building reliable automation and intelligent engineering workflows</text>
</svg>
