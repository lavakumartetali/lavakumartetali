<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <style>
      .bg{fill:url(#grad)}
      .title{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight:700; fill:#fff}
      .sub{font-family:Inter, sans-serif; font-weight:500; fill:#e6f6f5}
      .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace; fill:#d1f0ee}
    </style>
  </defs>

  <rect class="bg" width="1280" height="320" rx="12" />

  <!-- abstract neural nodes -->
  <g filter="url(#blur)" opacity="0.7">
    <circle cx="980" cy="80" r="70" fill="#7ef0e8" />
    <circle cx="1100" cy="220" r="50" fill="#4ad8d0" />
    <circle cx="240" cy="220" r="48" fill="#4ad8d0" />
  </g>

  <!-- connected lines -->
  <g stroke="#bff3ef" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M320 120 C420 60, 540 60, 640 120" />
    <path d="M640 120 C760 200, 900 200, 980 120" />
    <path d="M480 240 C560 180, 680 180, 760 240" />
  </g>

  <!-- code-like glyphs -->
  <g opacity="0.85" transform="translate(60,40)">
    <text x="0" y="40" font-size="18" class="mono">const embed = await client.embed(text)</text>
    <text x="0" y="70" font-size="18" class="mono">→ retrieve(&quot;similar docs&quot;)</text>
  </g>

  <!-- title -->
  <text x="80" y="130" font-size="48" class="title">Lava — Modern AI builder</text>
  <text x="80" y="170" font-size="20" class="sub">RAG · Agents · Real‑time systems · Security tooling — prototypes to demos</text>

  <!-- subtle footer info -->
  <g opacity="0.7">
    <text x="80" y="260" font-size="14" class="sub">TypeScript • React • Python • Embeddings • WebSockets • GitHub Actions</text>
  </g>
</svg>
